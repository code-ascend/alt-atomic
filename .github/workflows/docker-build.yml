name: Build Base Image with zstd:chunked

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      - name: Build and push base image with zstd:chunked
        run: |
          podman build \
            --layers \
            --format docker \
            --compress=zstd:chunked \
            -t ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:base \
            .
          podman push ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:base