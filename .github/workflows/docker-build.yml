name: Build Base image with Podman/Buildah

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Podman and Buildah
        run: |
          sudo apt-get update
          sudo apt-get -y install podman buildah

      - name: Login to GitHub Container Registry using Podman
        run: |
          podman login ghcr.io -u "${{ github.repository_owner }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Build image using Buildah with zstd:chunked compression
        run: |
          buildah bud --compression-format=zstd:chunked -t ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:base .

      - name: Push image using Podman
        run: |
          podman push ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:base
